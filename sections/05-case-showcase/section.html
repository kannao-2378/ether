<section
  class="case-showcase"
  id="case-showcase"
  aria-labelledby="case-showcase-title"
  data-section="05-case-showcase"
>
  <div class="case-showcase__heading">
    <h2 class="case-showcase__title" id="case-showcase-title">
      <span>年入2亿美金的</span>
      <span>跨境巨头品牌之路</span>
    </h2>
    <p class="case-showcase__description">
      <span>面对多市场、多渠道与多团队协作等多重叠加困境，</span>
      <span>QREATE 需要的不是一次视觉更新，而是一套从品牌认知到执行落地的系统重构。</span>
      <span>我们重新梳理品牌定位与视觉标准，并对官网、APP、移动端、社交媒体和营销物料进行系统升级。</span>
    </p>
  </div>

  <div class="case-showcase__media">
    <div class="case-showcase__state" id="case-panel-material" role="tabpanel" aria-labelledby="case-tab-material" aria-hidden="true" data-case-panel="material">
      <div class="case-showcase__comparison" aria-hidden="true"><span><img src="assets/images/case-material-before.png" alt="" width="1080" height="2400" decoding="async"></span><span><img src="assets/images/case-material-after.png" alt="" width="1080" height="2400" decoding="async"></span></div>
    </div>
    <div class="case-showcase__state" id="case-panel-app" role="tabpanel" aria-labelledby="case-tab-app" aria-hidden="true" data-case-panel="app">
      <div class="case-showcase__phones case-showcase__phones--autoplay" data-app-carousel>
        <div class="case-showcase__phone">
          <div class="case-showcase__phone-screen case-showcase__phone-screen--carousel" data-carousel-screen="before">
            <div class="case-showcase__carousel-track" data-carousel-track="before">
              <img src="assets/images/app/before/1.png" alt="APP重构前界面 1" width="2160" height="4800" decoding="async">
              <img src="assets/images/app/before/2.png" alt="APP重构前界面 2" width="2160" height="4800" decoding="async">
              <img src="assets/images/app/before/3.png" alt="APP重构前界面 3" width="2160" height="4800" decoding="async">
              <img src="assets/images/app/before/4.png" alt="APP重构前界面 4" width="2160" height="4800" decoding="async">
              <img src="assets/images/app/before/5.png" alt="APP重构前界面 5" width="2160" height="4800" decoding="async">
              <img src="assets/images/app/before/6.png" alt="APP重构前界面 6" width="2160" height="4800" decoding="async">
            </div>
            <span class="case-showcase__tap" data-tap="before" aria-hidden="true"></span>
          </div>
          <img class="case-showcase__phone-frame" src="assets/images/case-app.png" alt="" width="322" height="662">
        </div>
        <div class="case-showcase__phone">
          <div class="case-showcase__phone-screen case-showcase__phone-screen--carousel" data-carousel-screen="after">
            <div class="case-showcase__carousel-track" data-carousel-track="after">
              <img src="assets/images/app/after/1.png" alt="APP重构后界面 1" width="2332" height="5048" decoding="async">
              <img src="assets/images/app/after/2.png" alt="APP重构后界面 2" width="2330" height="5048" decoding="async">
              <img src="assets/images/app/after/3.png" alt="APP重构后界面 3" width="2330" height="5048" decoding="async">
              <img src="assets/images/app/after/4.png" alt="APP重构后界面 4" width="2330" height="5048" decoding="async">
              <img src="assets/images/app/after/5.png" alt="APP重构后界面 5" width="2330" height="5048" decoding="async">
              <img src="assets/images/app/after/6.png" alt="APP重构后界面 6" width="2332" height="5048" decoding="async">
            </div>
            <span class="case-showcase__tap" data-tap="after" aria-hidden="true"></span>
          </div>
          <img class="case-showcase__phone-frame" src="assets/images/case-app.png" alt="" width="322" height="662">
        </div>
      </div>
    </div>
    <div class="case-showcase__state is-active" id="case-panel-website" role="tabpanel" aria-labelledby="case-tab-website" aria-hidden="false" data-case-panel="website">
      <div class="case-showcase__comparison case-showcase__comparison--scroll" data-sync-comparison>
        <div
          class="case-showcase__scroll-pane"
          tabindex="0"
          role="region"
          aria-label="网页优化前长图"
          data-sync-pane="before"
        >
          <img
            src="assets/images/case-website-before.png"
            alt="网页优化前完整页面"
            width="1920"
            height="5706"
            decoding="async"
          >
        </div>
        <div
          class="case-showcase__scroll-pane"
          tabindex="0"
          role="region"
          aria-label="网页优化后长图"
          data-sync-pane="after"
        >
          <img
            src="assets/images/case-website-after.png"
            alt="网页优化后完整页面"
            width="1920"
            height="7734"
            decoding="async"
          >
        </div>
      </div>
    </div>
    <div class="case-showcase__state" id="case-panel-mobile" role="tabpanel" aria-labelledby="case-tab-mobile" aria-hidden="true" data-case-panel="mobile">
      <div class="case-showcase__phones">
        <div class="case-showcase__phone">
          <div
            class="case-showcase__phone-screen case-showcase__phone-screen--scroll"
            tabindex="0"
            role="region"
            aria-label="M端重构前长图"
          >
            <img
              src="assets/images/case-mobile-before.png"
              alt="M端重构前完整页面"
              width="486"
              height="4537"
              decoding="async"
            >
          </div>
          <img class="case-showcase__phone-frame" src="assets/images/case-mobile.png" alt="" width="322" height="662">
        </div>
        <div class="case-showcase__phone">
          <div
            class="case-showcase__phone-screen case-showcase__phone-screen--scroll"
            tabindex="0"
            role="region"
            aria-label="M端重构后长图"
          >
            <img
              src="assets/images/case-mobile-after.jpg"
              alt="M端重构后完整页面"
              width="1125"
              height="15918"
              decoding="async"
            >
          </div>
          <img class="case-showcase__phone-frame" src="assets/images/case-mobile.png" alt="" width="322" height="662">
        </div>
      </div>
    </div>
    <div class="case-showcase__state" id="case-panel-social" role="tabpanel" aria-labelledby="case-tab-social" aria-hidden="true" data-case-panel="social">
      <div class="case-showcase__comparison" aria-hidden="true"><span><img src="assets/images/case-social-before.png" alt="" width="3828" height="1938" decoding="async"></span><span><img src="assets/images/case-social-after.png" alt="" width="3828" height="1938" decoding="async"></span></div>
    </div>
  </div>

  <div class="case-showcase__controls">
    <div class="case-showcase__tabs" role="tablist" aria-label="跨境案例展示类型">
      <span class="case-showcase__indicator" aria-hidden="true"></span>
      <button class="case-showcase__tab" id="case-tab-material" type="button" role="tab" aria-selected="false" aria-controls="case-panel-material" tabindex="-1" data-case="material">物料升级</button>
      <button class="case-showcase__tab" id="case-tab-app" type="button" role="tab" aria-selected="false" aria-controls="case-panel-app" tabindex="-1" data-case="app">APP升级</button>
      <button class="case-showcase__tab is-active" id="case-tab-website" type="button" role="tab" aria-selected="true" aria-controls="case-panel-website" data-case="website">网站升级</button>
      <button class="case-showcase__tab" id="case-tab-mobile" type="button" role="tab" aria-selected="false" aria-controls="case-panel-mobile" tabindex="-1" data-case="mobile">M端升级</button>
      <button class="case-showcase__tab" id="case-tab-social" type="button" role="tab" aria-selected="false" aria-controls="case-panel-social" tabindex="-1" data-case="social">社媒升级</button>
    </div>
    <p class="case-showcase__hint">操作提示：上下滑动，同步查看重构前后</p>
    <p class="case-showcase__copy">网站升级：统一品牌表达，提升信息传递与转化效率。</p>
  </div>
</section>
