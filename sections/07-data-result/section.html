<section
  class="data-result"
  id="data-result"
  aria-labelledby="data-result-title"
  data-section="07-data-result"
>
  <h2 class="data-result__title" id="data-result-title">数据结果呈现</h2>

  <div class="data-result__card">
    <article class="data-result__group data-result__group--traffic">
      <h3>免费流量占比-对比</h3>
      <div class="data-result__line data-result__line--before">
        <span class="data-result__bar" style="--bar-width: 10.58%"></span>
        <span class="data-result__state">重构前</span>
        <strong>~5% 不到</strong>
      </div>
      <div class="data-result__line data-result__line--after">
        <span class="data-result__bar" style="--bar-width: 60.48%"></span>
        <span class="data-result__state">重构后</span>
        <strong>~60% 左右</strong>
      </div>
    </article>

    <article class="data-result__group data-result__group--conversion">
      <h3>转化率-对比</h3>
      <div class="data-result__line data-result__line--before">
        <span class="data-result__bar" style="--bar-width: 10.58%"></span>
        <span class="data-result__state">重构前</span>
        <strong>~0.1% 不到</strong>
      </div>
      <div class="data-result__line data-result__line--after">
        <span class="data-result__bar" style="--bar-width: 39.81%"></span>
        <span class="data-result__state">重构后</span>
        <strong>~1.5% 左右</strong>
      </div>
    </article>

    <article class="data-result__group data-result__group--sales">
      <h3>销售额-对比</h3>
      <div class="data-result__line data-result__line--before">
        <span class="data-result__bar" style="--bar-width: 30.48%"></span>
        <span class="data-result__state">重构前</span>
        <strong>200W 美元/季度</strong>
      </div>
      <div class="data-result__line data-result__line--after">
        <span class="data-result__bar" style="--bar-width: 72.4%"></span>
        <span class="data-result__state">重构后</span>
        <strong>510W 美元/季度</strong>
      </div>
    </article>
  </div>
</section>
