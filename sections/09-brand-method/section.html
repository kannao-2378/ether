<section
  class="brand-method"
  id="brand-method"
  aria-labelledby="brand-method-title"
  data-section="09-brand-method"
>
  <div class="brand-method__motion">
    <div class="brand-method__sticky">
      <div class="brand-method__canvas-shell">
        <div class="brand-method__canvas">
        <div class="brand-method__intro-cover" aria-hidden="true"></div>

        <svg
          class="brand-method__reveal-mask"
          viewBox="0 0 1920 1080"
          width="1920"
          height="1080"
          aria-hidden="true"
        >
          <defs>
            <mask id="brand-method-word-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
              <rect x="0" y="0" width="1920" height="1080" fill="#000"></rect>
              <text class="brand-method__mask-word" x="1040.5" y="539" fill="#fff">ETHER</text>
            </mask>
          </defs>
          <g class="brand-method__mask-media" mask="url(#brand-method-word-mask)">
            <image href="assets/brand-method/large-monitor-frame.png" x="-195" y="-111" width="2268" height="1935"></image>
            <image href="assets/brand-method/ether-mask-frame.png" x="-144" y="-4" width="2167" height="1086"></image>
          </g>
          <text class="brand-method__mask-label" x="1040.5" y="539">ETHER</text>
        </svg>

        <h2 class="brand-method__intro" id="brand-method-title">
          <span class="brand-method__intro-line brand-method__intro-line--first">品牌重塑是表象</span>
          <span class="brand-method__intro-line brand-method__intro-line--second"><span class="brand-method__intro-copy">背后是一套 </span><strong>ETHER</strong><span class="brand-method__intro-copy"> 方法论</span></span>
          <span class="brand-method__intro-line brand-method__intro-line--third">它可落地、可重复</span>
        </h2>

        <div class="brand-method__large-phone" aria-hidden="true">
          <video
            class="brand-method__large-phone-image"
            src="assets/brand-method/large-monitor-image.mp4"
            width="4334"
            height="2172"
            muted
            loop
            playsinline
            preload="none"
          ></video>
          <img
            class="brand-method__large-phone-frame"
            src="assets/brand-method/large-monitor-frame.png"
            alt=""
            width="3160"
            height="2696"
            decoding="async"
          >
        </div>
        <div class="brand-method__final-phone" aria-hidden="true">
          <video
            class="brand-method__final-phone-image"
            src="assets/brand-method/small-monitor-image.mp4"
            width="1873"
            height="939"
            muted
            loop
            playsinline
            preload="none"
          ></video>
          <img
            class="brand-method__final-phone-frame"
            src="assets/brand-method/small-monitor-frame.png"
            alt=""
            width="3160"
            height="2696"
            decoding="async"
          >
        </div>

        </div>
      </div>
    </div>
  </div>

  <div class="brand-method__detail-shell">
    <div class="brand-method__detail-canvas">
        <div class="brand-method__detail-copy" data-method-reveal>
          <p class="brand-method__eyebrow">方法论目标略解</p>
          <h3 class="brand-method__title">品牌管理方法论</h3>
          <p class="brand-method__description">为组织与个体、管理与执行、品牌与客户、制度与文化<br>建立起一套：内外一致、上下协同、知行合一的管理系统</p>
        </div>

        <div class="brand-method__principles" aria-label="品牌管理方法论三项原则">
          <article class="brand-method__principle brand-method__principle--left" data-method-reveal>
            <span class="brand-method__principle-icon brand-method__principle-icon--left" aria-hidden="true">
              <img src="assets/brand-method/3.svg" alt="" width="130" height="107">
            </span>
            <p><strong class="brand-method__principle-title">上下协同&nbsp;&nbsp;</strong><span class="brand-method__principle-copy">通过制度与文化让组织与个体、管理与执行在市场上始终一致</span></p>
          </article>

          <article class="brand-method__principle brand-method__principle--center" data-method-reveal>
            <span class="brand-method__principle-icon brand-method__principle-icon--center" aria-hidden="true">
              <img src="assets/brand-method/4.svg" alt="" width="93" height="91">
            </span>
            <p><strong class="brand-method__principle-title">内外一致&nbsp;&nbsp;</strong><span class="brand-method__principle-copy">让企业的品牌表达<br>与客户认知体验保持一致</span></p>
          </article>

          <article class="brand-method__principle brand-method__principle--right" data-method-reveal>
            <span class="brand-method__principle-icon brand-method__principle-icon--right" aria-hidden="true">
              <img src="assets/brand-method/6.svg" alt="" width="108" height="108">
            </span>
            <p><strong class="brand-method__principle-title">知行合一&nbsp;&nbsp;</strong><span class="brand-method__principle-copy">在每一次的社会实践中，沉淀出可复用可迁移的底层系统思维</span></p>
          </article>
        </div>

        <button class="brand-method__cta" type="button" data-method-reveal>
          <span>点击了解管理方法论如何落地</span>
          <img src="assets/brand-method/1.svg" alt="" width="37" height="37">
        </button>
    </div>
  </div>
</section>
